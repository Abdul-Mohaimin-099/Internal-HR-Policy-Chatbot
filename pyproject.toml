[project]
name = "hr-policy-chatbot"
version = "0.1.0"
description = "Internal HR Policy Chatbot — answers employee questions about company policies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "docling>=2.84.0",
    "fastapi[standard]>=0.140.0",
    "google-genai>=1.70.0",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-core>=1.2.28",
    "langchain-google-genai>=4.3.1",
    "langchain-text-splitters>=1.1.1",
    "langgraph>=1.1.6",
    "langgraph-checkpoint-postgres>=3.0.5",
    "psycopg[binary]>=3.3.3",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.17.1",
    "sqlalchemy[asyncio]>=2.0.49",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hr_chatbot"]

# Tell hatchling the package lives under src/ (src-layout).
[tool.hatch.build.targets.wheel.force-include]
"src/hr_chatbot" = "hr_chatbot"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "reportlab>=5.0.0",
    "ruff>=0.16.1",
]
